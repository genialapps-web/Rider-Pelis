<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIDER TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0e0e11;--s:#17171c;--s2:#22222a;--r:#e50914;--t:#f2f2f4;--d:#9a9aa6;--ln:#2a2a33}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);font:400 15px/1.4 Manrope,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
:focus{outline:2px solid var(--r);outline-offset:2px}
.c:focus{outline:0}.c:focus img{box-shadow:0 0 0 3px #fff;transform:scale(1.06)}.ep:focus{background:var(--s2)}
.logo{font:400 34px 'Bebas Neue';letter-spacing:2px;color:var(--r)}
#gate{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#2a0508,var(--bg) 60%);z-index:50;padding:20px}
.box{width:100%;max-width:400px;background:var(--s);border:1px solid var(--ln);border-radius:14px;padding:36px 28px;text-align:center}
.box p{color:var(--d);margin:6px 0 24px}
input{width:100%;padding:13px 14px;background:var(--s2);border:1px solid var(--ln);border-radius:10px;color:var(--t);font:inherit;outline:0}
input:focus{border-color:var(--r)}
.btn{width:100%;margin-top:12px;padding:14px;border-radius:10px;background:var(--r);font-weight:800}
#msg{margin-top:14px;font-size:14px;min-height:20px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:12px 4vw;background:rgba(14,14,17,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
header .logo{font-size:28px}
nav{display:flex;gap:4px}
nav button{padding:8px 14px;border-radius:8px;color:var(--d);font-weight:600}
nav button.on{color:var(--t);background:var(--s2)}
.sb{flex:1;max-width:400px;margin-left:auto}
.out{color:var(--d);font-size:13px}
main{padding:20px 4vw 60px}
h2{font-size:19px;font-weight:800;margin:26px 0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;background:var(--s);border:1px solid var(--ln);font-size:13px;color:var(--d)}
.chip.on{background:var(--r);border-color:var(--r);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 16px}
.row{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.row .c{flex:none;width:150px}
.c{cursor:pointer}
.c img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;background:var(--s2);display:block;transition:transform .2s,box-shadow .2s}
.c:hover img{transform:translateY(-4px);box-shadow:0 8px 24px rgba(229,9,20,.25)}
.c h3{font-size:13px;font-weight:600;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c small{color:var(--d);font-size:12px}
.c.tv img{aspect-ratio:16/10;object-fit:contain;padding:14px;background:var(--s);border:1px solid var(--ln)}.row .c.tv{width:170px}.grid.gl{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--r);margin-right:6px;animation:p 1.4s infinite}@keyframes p{50%{opacity:.25}}
.sent{height:1px;grid-column:1/-1}
.empty{color:var(--d);text-align:center;padding:80px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
.ov.on{display:flex}
#sp{width:100%;max-width:760px;max-height:90vh;overflow:auto;background:var(--s);border:1px solid var(--ln);border-radius:14px;padding:22px;position:relative}
.x{position:absolute;top:12px;right:14px;font-size:20px;color:var(--d)}
.sh{display:flex;gap:16px;align-items:flex-end;margin-bottom:10px}
.sh img{width:96px;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:var(--s2)}
.sh h2{margin:0 0 4px}
.sh small{color:var(--d)}
.ep{display:flex;gap:14px;width:100%;text-align:left;padding:11px 12px;border-radius:8px}
.ep:hover{background:var(--s2)}
.ep b{flex:none;width:30px;color:var(--r)}
@media(max-width:700px){header{flex-wrap:wrap;gap:10px}.sb{order:3;max-width:none;flex-basis:100%}.out{margin-left:auto}.grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:16px 12px}.row .c{width:118px}}
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <div class="logo">RIDER TV</div>
    <p>Ingresa tu código de acceso</p>
    <input id="code" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters">
    <button class="btn" id="enter">Ingresar</button>
    <div id="msg"></div>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="logo">RIDER TV</div>
    <nav>
      <button data-v="inicio" class="on">Inicio</button>
      <button data-v="peliculas">Películas</button>
      <button data-v="series">Series</button>
      <button data-v="envivo"><i class="live"></i>En vivo</button>
    </nav>
    <input class="sb" id="q" type="search" placeholder="Buscar películas y series…" autocomplete="off">
    <button class="out" id="out">Salir</button>
  </header>
  <main>
    <section id="v-inicio"></section>
    <section id="v-peliculas" hidden><div class="chips" id="cm"></div><div class="grid" id="gm"></div></section>
    <section id="v-series" hidden><div class="chips" id="cs"></div><div class="grid" id="gs"></div></section>
    <section id="v-envivo" hidden><div class="chips" id="cl"></div><div class="grid gl" id="gl"></div></section>
    <section id="v-buscar" hidden></section>
  </main>
</div>

<div class="ov" id="so"><div id="sp"></div></div>

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const esc=t=>String(t||'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const load=u=>fetch(encodeURI(u)).then(r=>r.ok?r.json():[]).catch(()=>[]);
// Los JSON empiezan a descargarse de inmediato, en paralelo con la validación del código
const F={
  m:[1,2,3,4].map(n=>'contenido peliculas '+n+'.json'),
  s:[1,2,3,4,5,6,7,8].map(n=>'contenido series '+n+'.json'),
  l:['canales en vivo.json']
};
const raw={m:[],s:[],l:[]};
let ready=0,done=0,tmr;
// Cada trozo se suma apenas llega; la pantalla se actualiza sin esperar a los demás
const LOADS=Object.entries(F).map(([k,fs])=>Promise.all(fs.map(f=>load('./'+f).then(a=>{
  if(a&&!Array.isArray(a))a=Object.values(a).find(Array.isArray);
  if(Array.isArray(a))raw[k]=raw[k].concat(a);
  if(ready){clearTimeout(tmr);tmr=setTimeout(refresh,500)}
}))));
Promise.all(LOADS).then(()=>{done=1;if(ready){clearTimeout(tmr);refresh()}});
firebase.initializeApp({apiKey:"AIzaSyCBZki64bsD7E7eCx19EAFPjlpDvngUf7o",authDomain:"rider-tv.firebaseapp.com",projectId:"rider-tv",storageBucket:"rider-tv.firebasestorage.app",messagingSenderId:"170739641097",appId:"1:170739641097:web:7bda16abe08ff26516c1d8"});
const db=firebase.firestore();
const PH='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="150" height="225"><rect width="150" height="225" fill="#22222a"/><text x="75" y="125" font-size="38" text-anchor="middle">🎬</text></svg>');
addEventListener('error',e=>{const i=e.target;if(i.tagName=='IMG'&&i.src!==PH)i.src=PH},true);

let M=[],S=[],L=[],lcat='',tab='inicio',cat='',scat='',cur;

/* ---------- Acceso ---------- */
let started=0;
function show(){$('#gate').hidden=true;$('#app').hidden=false;if(!started){started=1;init()}}
const DEV=localStorage.rider_dev||(localStorage.rider_dev=(crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random()).slice(0,36));
async function validar(code,silent){
  const say=(t,c,f)=>{if(!silent||f){$('#msg').textContent=t;$('#msg').style.color=c||'#ff6b6b'}};
  if(!code)return say('Escribe tu código');
  say('Verificando…','#ffcc00');
  const ref=db.collection('accesos_permanentes').doc(code);
  try{
    const r=await db.runTransaction(async t=>{
      const d=await t.get(ref);
      if(!d.exists)return'no';
      const x=d.data();
      if(!x.activo)return'off';
      const l=x.dispositivos||[];
      if(!l.some(e=>(e.id||e)==DEV)){
        if(l.length>=(x.maxDispositivos||3))return'max';
        l.push({id:DEV,fecha:Date.now(),eq:navigator.userAgent.slice(0,60)});
      }
      t.update(ref,{dispositivos:l,ultimoUso:firebase.firestore.FieldValue.serverTimestamp()});
      return'ok';
    });
    if(r!='ok'){
      localStorage.removeItem('rider_activo');$('#app').hidden=true;$('#gate').hidden=false;
      return say({no:'Código no encontrado',off:'Acceso desactivado',max:'Este código ya se usa en el máximo de dispositivos permitidos'}[r],0,1);
    }
    localStorage.setItem('rider_codigo',code);localStorage.setItem('rider_activo','true');
    show();
  }catch(e){say('Error de conexión')}
}
$('#enter').onclick=()=>validar($('#code').value.trim().toUpperCase());
$('#code').onkeydown=e=>e.key=='Enter'&&$('#enter').click();
$('#out').onclick=()=>{localStorage.removeItem('rider_activo');localStorage.removeItem('rider_codigo');location.reload()};
// Si ya hay sesión guardada, entra al instante y valida el código en segundo plano
const sv=localStorage.getItem('rider_codigo');
if(localStorage.getItem('rider_activo')=='true'&&sv){show();validar(sv,true)}else $('#code').focus();

/* ---------- Datos ---------- */
const norm=a=>(Array.isArray(a)?a:[]).filter(x=>x&&x.streamUrl).map(x=>({t:x.title||'Sin título',u:x.streamUrl,i:x.imageUrl||'',c:x.category||'General',k:((x.title||'')+' '+(x.category||'')).toLowerCase()}));
// Canales en vivo: acepta distintos nombres de campo y que el JSON sea lista u objeto con una lista
const normL=a=>{if(a&&!Array.isArray(a))a=Object.values(a).find(Array.isArray)||[];return(a||[]).map(x=>{const u=x&&(x.streamUrl||x.url||x.stream||x.link),t=x&&(x.title||x.name||x.nombre||x.channel)||'Canal',c=x&&(x.category||x.group||x.grupo||x.categoria)||'General';return u&&{t,u,i:x.imageUrl||x.logo||x.image||x.icon||x.tvgLogo||'',c,k:(t+' '+c).toLowerCase()}}).filter(Boolean)};
const RX=/^(.*?)[\s._-]*(?:S(\d{1,2})\s*[EX]\s*(\d{1,3})|(\d{1,2})x(\d{1,3})|T(\d{1,2})\s*E(\d{1,3})|temporada\s*(\d{1,2})\D+?(\d{1,3}))/i;
function agrupar(list){
  const m=new Map();
  for(const it of list){
    const r=RX.exec(it.t);let n=it.t,s=1,e=0;
    if(r&&r[1].trim()){n=r[1].trim();s=+(r[2]||r[4]||r[6]||r[8]);e=+(r[3]||r[5]||r[7]||r[9])}
    const k=n.toLowerCase();let g=m.get(k);
    if(!g)m.set(k,g={nm:n,i:it.i,c:it.c,eps:[],k:k+' '+it.c.toLowerCase()});
    if(!g.i&&it.i)g.i=it.i;
    g.eps.push({...it,s,e});
  }
  const a=[...m.values()].sort((x,y)=>x.nm.localeCompare(y.nm,'es'));
  a.forEach((g,i)=>{g.id=i;g.ns=new Set(g.eps.map(e=>e.s)).size});
  return a;
}
function refresh(){
  M=norm(raw.m);M.forEach((x,i)=>x.id=i);
  S=agrupar(norm(raw.s));
  L=normL(raw.l);L.forEach((x,i)=>x.id=i);
  home();pelis();series();vivo();
}
function init(){ready=1;refresh()}

/* ---------- Render ---------- */
const sub=g=>g.ns>1?g.ns+' temporadas':g.eps.length+(g.eps.length==1?' episodio':' episodios');
const card=(x,t)=>`<div class="c${t=='l'?' tv':''}" tabindex="0" data-t="${t}" data-id="${x.id}"><img loading="lazy" decoding="async" src="${esc(x.i)}" alt=""><h3>${esc(t=='s'?x.nm:x.t)}</h3><small>${t=='s'?sub(x):esc(x.c)}</small></div>`;
function fill(el,arr){
  el._io&&el._io.disconnect();el.innerHTML='';
  if(!arr.length){el.innerHTML='<p class="empty">No hay contenido para mostrar.</p>';return}
  let p=0;const s=document.createElement('div');s.className='sent';
  const io=el._io=new IntersectionObserver(es=>{if(es[0].isIntersecting)more()},{rootMargin:'900px'});
  function more(){
    io.unobserve(s);
    if(p>=arr.length){s.remove();return}
    s.remove();el.insertAdjacentHTML('beforeend',arr.slice(p,p+48).join(''));p+=48;
    el.append(s);io.observe(s);
  }
  more();
}
function chips(el,list,cur,attr){
  const n={};list.forEach(x=>n[x.c]=(n[x.c]||0)+1);
  const top=Object.entries(n).sort((a,b)=>b[1]-a[1]).slice(0,40);
  el.innerHTML=[['','Todo']].concat(top.map(([c])=>[c,c])).map(([c,l])=>`<button class="chip ${c==cur?'on':''}" data-${attr}="${esc(c)}">${esc(l)}</button>`).join('');
}
const rowH=(t,a,k)=>`<h2>${esc(t)}</h2><div class="row">${a.map(x=>card(x,k)).join('')}</div>`;
function home(){
  const by={};M.forEach(x=>(by[x.c]=by[x.c]||[]).push(x));
  const cs=Object.entries(by).sort((a,b)=>b[1].length-a[1].length).slice(0,8);
  $('#v-inicio').innerHTML=(L.length?rowH('En vivo',L.slice(0,24),'l'):'')+(S.length?rowH('Series',S.slice(0,24),'s'):'')+cs.map(([c,a])=>rowH(c,a.slice(0,24),'m')).join('')||'<p class="empty">'+(done?'No se pudo cargar el contenido.':'Cargando contenido…')+'</p>';
}
function vivo(){chips($('#cl'),L,lcat,'lcat');fill($('#gl'),L.filter(x=>!lcat||x.c==lcat).map(x=>card(x,'l')))}
function pelis(){chips($('#cm'),M,cat,'cat');fill($('#gm'),M.filter(x=>!cat||x.c==cat).map(x=>card(x,'m')))}
function series(){chips($('#cs'),S,scat,'scat');fill($('#gs'),S.filter(x=>!scat||x.c==scat).map(x=>card(x,'s')))}

/* ---------- Navegación y búsqueda ---------- */
function go(v){
  $$('section').forEach(s=>s.hidden=s.id!='v-'+v);
  if(v!='buscar'){tab=v;$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));scrollTo(0,0)}
}
$$('nav button').forEach(b=>b.onclick=()=>{$('#q').value='';go(b.dataset.v)});
let tm;
$('#q').oninput=e=>{
  clearTimeout(tm);
  tm=setTimeout(()=>{
    const q=e.target.value.trim().toLowerCase();
    if(q.length<2)return go(tab);
    const m=M.filter(x=>x.k.includes(q)),s=S.filter(x=>x.k.includes(q)),l=L.filter(x=>x.k.includes(q));
    $('#v-buscar').innerHTML=`<h2>${m.length+s.length+l.length} resultados para “${esc(q)}”</h2>`+(l.length?'<h2>En vivo</h2><div class="grid gl" id="r3"></div>':'')+(s.length?'<h2>Series</h2><div class="grid" id="r1"></div>':'')+(m.length?'<h2>Películas</h2><div class="grid" id="r2"></div>':'');
    if(l.length)fill($('#r3'),l.map(x=>card(x,'l')));
    if(s.length)fill($('#r1'),s.map(x=>card(x,'s')));
    if(m.length)fill($('#r2'),m.map(x=>card(x,'m')));
    go('buscar');
  },140);
};
/* ---------- Control remoto / teclado (flechas, OK, Atrás) ---------- */
let lastF;
function closeS(){$('#so').classList.remove('on');lastF&&lastF.focus()}
function nav(k){
  const root=$('#so').classList.contains('on')?$('#sp'):document;
  const els=[...root.querySelectorAll('button,input,.c')].filter(e=>e.getClientRects().length);
  const cu=document.activeElement;
  if(!els.includes(cu)){const f=els.find(e=>e.classList.contains('c'))||els[0];f&&f.focus();return}
  const a=cu.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2,h=k=='ArrowLeft'||k=='ArrowRight';
  let best,bs=1e9;
  for(const e of els){
    if(e===cu)continue;
    const r=e.getBoundingClientRect(),dx=r.left+r.width/2-ax,dy=r.top+r.height/2-ay;
    const f=k=='ArrowRight'?dx:k=='ArrowLeft'?-dx:k=='ArrowDown'?dy:-dy;
    if(f<4)continue;
    const sc=f+(h?Math.abs(dy):Math.abs(dx))*2.5;
    if(sc<bs){bs=sc;best=e}
  }
  if(best){best.focus({preventScroll:true});best.scrollIntoView({block:'center',inline:'center',behavior:'smooth'})}
}
addEventListener('keydown',e=>{
  const k=e.key,t=e.target,inp=t.tagName=='INPUT';
  if(k=='/'&&!inp&&!$('#app').hidden){e.preventDefault();return $('#q').focus()}
  if(k.startsWith('Arrow')){
    // dentro de un campo de texto, izquierda/derecha mueven el cursor
    if(inp&&(k=='ArrowLeft'&&t.selectionStart>0||k=='ArrowRight'&&t.selectionEnd<t.value.length))return;
    e.preventDefault();return nav(k)
  }
  if(k=='Enter'&&t.classList.contains('c'))return t.click();
  const back=k=='Escape'||k=='GoBack'||k=='BrowserBack'||e.keyCode==10009||e.keyCode==461||(k=='Backspace'&&!inp);
  if(back){
    if($('#so').classList.contains('on')){e.preventDefault();closeS()}
    else if(document.activeElement!==document.body&&!$('#app').hidden&&tab!='inicio'&&!inp){e.preventDefault();$('#q').value='';go('inicio')}
  }
});

/* ---------- Clicks ---------- */
document.addEventListener('click',e=>{
  const c=e.target.closest('.c'),ch=e.target.closest('.chip'),ep=e.target.closest('.ep');
  if(c){const id=+c.dataset.id;c.dataset.t=='m'?play(M[id].u):c.dataset.t=='l'?openL(L[id]):openS(S[id])}
  else if(ch&&ch.dataset.cat!==undefined){cat=ch.dataset.cat;pelis()}
  else if(ch&&ch.dataset.scat!==undefined){scat=ch.dataset.scat;series()}
  else if(ch&&ch.dataset.lcat!==undefined){lcat=ch.dataset.lcat;vivo()}
  else if(ch&&ch.dataset.s!==undefined){drawS(+ch.dataset.s);const o=$('#sp .chip.on');o&&o.focus()}
  else if(ep&&ep.dataset.vlc)vlc(ep.dataset.vlc)
  else if(ep)play(ep.dataset.u)
  else if(e.target.id=='so'||e.target.classList.contains('x'))closeS();;
});

/* ---------- Series: temporadas y episodios ---------- */
/* ---------- Canales en vivo (.ts): VLC o enlace directo ---------- */
function openL(x){
  lastF=document.activeElement;
  $('#sp').innerHTML=`<button class="x" aria-label="Cerrar">✕</button><div class="sh"><img src="${esc(x.i)}" alt=""><div><h2>${esc(x.t)}</h2><small><i class="live"></i>En vivo · ${esc(x.c)}</small></div></div>
  <button class="ep" data-vlc="${esc(x.u)}"><b>▶</b><span>Reproducir en VLC (recomendado)</span></button>
  <button class="ep" data-u="${esc(x.u)}"><b>↗</b><span>Abrir enlace directo</span></button>`;
  $('#so').classList.add('on');$('#sp .ep').focus();
}
function vlc(u){
  location.href=/android/i.test(navigator.userAgent)
    ?'intent://'+u.replace(/^\w+:\/\//,'')+'#Intent;scheme='+u.split(':')[0]+';type=video/*;package=org.videolan.vlc;end'
    :'vlc://'+u;
}
function openS(g){lastF=document.activeElement;cur=g;drawS(Math.min(...g.eps.map(e=>e.s)));$('#so').classList.add('on');const f=$('#sp .ep');f&&f.focus()}
function drawS(n){
  const g=cur,ss=[...new Set(g.eps.map(e=>e.s))].sort((a,b)=>a-b);
  $('#sp').innerHTML=`<button class="x" aria-label="Cerrar">✕</button><div class="sh"><img src="${esc(g.i)}" alt=""><div><h2>${esc(g.nm)}</h2><small>${sub(g)} · ${esc(g.c)}</small></div></div>`
  +(ss.length>1?`<div class="chips">${ss.map(s=>`<button class="chip ${s==n?'on':''}" data-s="${s}">Temporada ${s}</button>`).join('')}</div>`:'')
  +g.eps.filter(e=>e.s==n).sort((a,b)=>a.e-b.e).map(e=>`<button class="ep" data-u="${esc(e.u)}" data-t="${esc(g.nm+(e.e?' · T'+n+' E'+e.e:''))}"><b>${e.e||'▶'}</b><span>${esc(e.t)}</span></button>`).join('');
}

/* ---------- Reproducción: todo se abre en ventana nueva ---------- */
function play(u){if(u)window.open(u,'_blank','noopener')}
</script>
</body>
</html>
