<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIDER TV — Administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0e0e11;--s:#17171c;--s2:#22222a;--r:#e50914;--g:#46d369;--y:#ffcc00;--t:#f2f2f4;--d:#9a9aa6;--ln:#2a2a33}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--t);font:400 14px/1.45 Manrope,sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--r);outline-offset:2px}
.logo{font:400 28px 'Bebas Neue';letter-spacing:2px;color:var(--r)}
input,select{width:100%;padding:12px;background:var(--s2);border:1px solid var(--ln);border-radius:9px;color:var(--t);font:inherit;outline:0}
input:focus,select:focus{border-color:var(--r)}
label{display:block;font-size:12px;color:var(--d);margin-bottom:6px;font-weight:600}
.btn{padding:12px 20px;border-radius:9px;background:var(--r);font-weight:800}
.btn.g{background:var(--g);color:#000}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#2a0508,var(--bg) 60%)}
.box{width:100%;max-width:380px;background:var(--s);border:1px solid var(--ln);border-radius:14px;padding:34px 28px}
.box p{color:var(--d);margin:4px 0 22px}
.box .btn{width:100%;margin-top:12px}
#le{color:#ff6b6b;margin-top:10px;min-height:18px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 4vw;border-bottom:1px solid var(--ln);background:var(--s);position:sticky;top:0;z-index:10}
header span{color:var(--d);font:600 13px Manrope;margin-left:10px}
.lnk{color:var(--d);margin-left:18px}
.wrap{max-width:1100px;margin:0 auto;padding:26px 4vw 60px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.st{background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:16px 18px}
.st b{display:block;font-size:28px;font-weight:800}
.st small{color:var(--d)}
.card{background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:22px;margin-bottom:22px}
.card h2{font-size:17px;margin-bottom:16px}
.fg{display:grid;grid-template-columns:2fr 1fr 2fr auto;gap:14px;align-items:end}
#res{display:none;margin-top:16px;padding:14px 16px;border:1px solid var(--g);background:rgba(70,211,105,.07);border-radius:10px;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
#res code{font:800 22px/1 monospace;letter-spacing:2px;color:var(--g)}
.tb{display:flex;gap:12px;margin-bottom:14px}
.tb select{width:170px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:12px;text-align:left;border-bottom:1px solid var(--ln)}
th{font-size:12px;color:var(--d);font-weight:600}
td code{background:var(--s2);padding:3px 8px;border-radius:6px;font-weight:700;letter-spacing:1px}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800}
.on{background:rgba(70,211,105,.14);color:var(--g)}
.off{background:rgba(255,107,107,.14);color:#ff6b6b}
.act button{padding:6px 10px;border:1px solid var(--ln);border-radius:7px;margin-right:6px;font-size:12px;color:var(--d)}
.act button:hover{color:var(--t);border-color:var(--d)}
.act .del:hover{color:#ff6b6b;border-color:#ff6b6b}
small.n{display:block;color:var(--d);font-size:12px}
.empty{text-align:center;color:var(--d);padding:40px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--ln);padding:11px 20px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on2{opacity:1}
@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.fg{grid-template-columns:1fr}.tb{flex-direction:column}.tb select{width:100%}}
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <div class="logo">RIDER TV</div>
    <p>Panel de administración</p>
    <input type="password" id="pw" placeholder="Contraseña" autocomplete="current-password">
    <div id="le"></div>
    <button class="btn" id="go">Entrar</button>
  </div>
</div>

<div id="panel" hidden>
  <header>
    <div><span class="logo">RIDER TV</span><span>Administración</span></div>
    <div><a class="lnk" href="index.html">Ver sitio</a><button class="lnk" id="out">Salir</button></div>
  </header>
  <div class="wrap">
    <div class="stats">
      <div class="st"><b id="s1">0</b><small>Códigos creados</small></div>
      <div class="st"><b id="s2" style="color:var(--g)">0</b><small>Activos</small></div>
      <div class="st"><b id="s3" style="color:#ff6b6b">0</b><small>Desactivados</small></div>
      <div class="st"><b id="s4">0</b><small>Dispositivos en uso</small></div>
    </div>

    <div class="card">
      <h2>Crear código de acceso</h2>
      <div class="fg">
        <div><label for="nom">Cliente</label><input id="nom" placeholder="Nombre completo"></div>
        <div><label for="max">Dispositivos máx.</label><input id="max" type="number" value="3" min="1" max="10"></div>
        <div><label for="nota">Notas (opcional)</label><input id="nota" placeholder="Ej: pago directo $100"></div>
        <button class="btn g" id="crear">Generar código</button>
      </div>
      <div id="res"><div><small class="n">Código creado — compártelo con el cliente</small><code id="cod"></code></div><button class="btn" id="cp">Copiar código</button></div>
    </div>

    <div class="card">
      <h2>Todos los accesos</h2>
      <div class="tb">
        <input id="bus" type="search" placeholder="Buscar por cliente, código o nota…">
        <select id="fil"><option value="">Todos</option><option value="1">Activos</option><option value="0">Desactivados</option></select>
      </div>
      <div class="tw">
        <table>
          <thead><tr><th>Código</th><th>Cliente</th><th>Estado</th><th>Dispositivos</th><th>Último uso</th><th>Creado</th><th>Acciones</th></tr></thead>
          <tbody id="tb"><tr><td colspan="7" class="empty">Cargando…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const PASS='admin123'; // Cámbiala por la tuya
firebase.initializeApp({apiKey:"AIzaSyCBZki64bsD7E7eCx19EAFPjlpDvngUf7o",authDomain:"rider-tv.firebaseapp.com",projectId:"rider-tv",storageBucket:"rider-tv.firebasestorage.app",messagingSenderId:"170739641097",appId:"1:170739641097:web:7bda16abe08ff26516c1d8"});
const col=firebase.firestore().collection('accesos_permanentes');
const $=s=>document.querySelector(s);
const esc=t=>String(t||'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let rows=[],unsub;

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on2');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on2'),2200)}

/* Sesión */
function enter(){$('#login').hidden=true;$('#panel').hidden=false;sessionStorage.setItem('adm','1');escuchar()}
$('#go').onclick=()=>$('#pw').value===PASS?enter():$('#le').textContent='Contraseña incorrecta';
$('#pw').onkeydown=e=>e.key=='Enter'&&$('#go').click();
$('#out').onclick=()=>{sessionStorage.clear();unsub&&unsub();location.reload()};
if(sessionStorage.getItem('adm'))enter();

/* Generar código */
function nuevo(){
  const L='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',b=crypto.getRandomValues(new Uint8Array(12));
  return [0,4,8].map(i=>[...b.slice(i,i+4)].map(x=>L[x%L.length]).join('')).join('-');
}
$('#crear').onclick=async()=>{
  const nombre=$('#nom').value.trim();
  if(!nombre)return toast('Escribe el nombre del cliente');
  const btn=$('#crear');btn.disabled=true;
  try{
    let c,ref;
    do{c=nuevo();ref=col.doc(c)}while((await ref.get()).exists);
    await ref.set({activo:true,nombre,maxDispositivos:Math.min(10,Math.max(1,parseInt($('#max').value)||3)),dispositivos:[],notas:$('#nota').value.trim(),fechaCreacion:firebase.firestore.FieldValue.serverTimestamp()});
    $('#cod').textContent=c;$('#res').style.display='flex';
    $('#nom').value='';$('#nota').value='';toast('Código creado');
  }catch(e){toast('Error: '+e.message)}
  btn.disabled=false;
};
$('#cp').onclick=()=>navigator.clipboard.writeText($('#cod').textContent).then(()=>toast('Código copiado'));

/* Lista en tiempo real */
function escuchar(){
  unsub=col.orderBy('fechaCreacion','desc').onSnapshot(s=>{
    if(rows.length)s.docChanges().forEach(c=>{if(c.type=='modified'){const o=rows.find(r=>r.id==c.doc.id),n=c.doc.data();if(o&&(n.dispositivos||[]).length>(o.dispositivos||[]).length)toast('Código '+c.doc.id+' usado: '+n.dispositivos.length+'/'+(n.maxDispositivos||3)+' dispositivos')}});
    rows=s.docs.map(d=>({id:d.id,...d.data()}));pintar()},e=>{$('#tb').innerHTML=`<tr><td colspan="7" class="empty">Error al cargar: ${esc(e.message)}</td></tr>`});
}
function pintar(){
  const q=$('#bus').value.trim().toLowerCase(),f=$('#fil').value;
  $('#s1').textContent=rows.length;
  $('#s2').textContent=rows.filter(r=>r.activo).length;
  $('#s3').textContent=rows.filter(r=>!r.activo).length;
  $('#s4').textContent=rows.reduce((a,r)=>a+(r.dispositivos||[]).length,0);
  const v=rows.filter(r=>(!f||String(+!!r.activo)==f)&&(!q||(r.id+' '+(r.nombre||'')+' '+(r.notas||'')).toLowerCase().includes(q)));
  $('#tb').innerHTML=v.length?v.map(r=>{
    const fe=r.fechaCreacion?r.fechaCreacion.toDate().toLocaleDateString('es-MX'):'—';
    return `<tr><td><code>${r.id}</code></td><td>${esc(r.nombre||'Sin nombre')}${r.notas?`<small class="n">${esc(r.notas)}</small>`:''}</td>
    <td><span class="tag ${r.activo?'on':'off'}">${r.activo?'Activo':'Desactivado'}</span></td>
    <td><span class="tag ${(r.dispositivos||[]).length>=(r.maxDispositivos||3)?'off':'on'}">${(r.dispositivos||[]).length}/${r.maxDispositivos||3}</span></td><td>${r.ultimoUso?r.ultimoUso.toDate().toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'}):'Sin usar'}</td><td>${fe}</td>
    <td class="act" data-id="${r.id}"><button data-a="copy">Copiar</button><button data-a="tog">${r.activo?'Desactivar':'Activar'}</button><button data-a="rst">Liberar dispositivos</button><button class="del" data-a="del">Eliminar</button></td></tr>`;
  }).join(''):'<tr><td colspan="7" class="empty">No hay códigos que coincidan.</td></tr>';
}
$('#bus').oninput=pintar;$('#fil').onchange=pintar;
$('#tb').onclick=async e=>{
  const b=e.target.closest('button');if(!b)return;
  const id=b.parentNode.dataset.id,r=rows.find(x=>x.id==id),a=b.dataset.a;
  try{
    if(a=='copy'){await navigator.clipboard.writeText(id);toast('Código copiado')}
    if(a=='tog'){await col.doc(id).update({activo:!r.activo});toast(r.activo?'Código desactivado':'Código activado')}
    if(a=='rst'&&confirm('¿Liberar todos los dispositivos de este código?')){await col.doc(id).update({dispositivos:[]});toast('Dispositivos liberados')}
    if(a=='del'&&confirm('¿Eliminar el código '+id+'? El cliente perderá el acceso.')){await col.doc(id).delete();toast('Código eliminado')}
  }catch(er){toast('Error: '+er.message)}
};
</script>
</body>
</html>
